services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-csadmin_kwq&3jf0$$#57}
      - DEBUG=${DEBUG:-false}
      - DB_PATH=/app/data/database.db
      - JWT_EXPIRY_HOURS=24
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app_data:
