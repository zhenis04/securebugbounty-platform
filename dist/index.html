  <!-- JWT API Compatibility Layer -->
  <script>
    // Intercept fetch to auto-inject JWT tokens
    (function () {
      const originalFetch = window.fetch;
      window.fetch = function (url, options) {
        options = options || {};
        const urlStr = typeof url === 'string' ? url : url.toString();

        // Only intercept /api/ calls
        if (urlStr.startsWith('/api/')) {
          const token = localStorage.getItem('authToken');
          if (token) {
            options.headers = options.headers || {};
            if (options.headers instanceof Headers) {
              if (!options.headers.has('Authorization')) {
                options.headers.set('Authorization', 'Bearer ' + token);
              }
            } else {
              if (!options.headers['Authorization']) {
                options.headers['Authorization'] = 'Bearer ' + token;
              }
            }
          }
        }

        return originalFetch.call(this, url, options).then(function (response) {
          // Handle login response: extract and store JWT token
          if (urlStr === '/api/login' && response.ok) {
            const cloned = response.clone();
            cloned.json().then(function (data) {
              if (data.token) {
                localStorage.setItem('authToken', data.token);
              }
            }).catch(function () { });
          }

          // If 401 on any API call, clear token (session expired)
          if (response.status === 401 && urlStr !== '/api/login') {
            localStorage.removeItem('authToken');
          }

          return response;
        });
      };
    })();
  </script>
